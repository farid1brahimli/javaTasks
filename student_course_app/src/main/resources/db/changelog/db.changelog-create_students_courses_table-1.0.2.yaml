databaseChangeLog:
  - changeSet:
      id: 3
      author: farid
      changes:
        - createTable:
            tableName: student_course
            columns:
              - column:
                  name: student_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_student_id
                    references: students(id)
              - column:
                  name: course_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_course_id
                    references: courses(id)

        - addPrimaryKey:
            tableName: student_course
            columnNames: student_id, course_id
            constraintName: pk_student_course